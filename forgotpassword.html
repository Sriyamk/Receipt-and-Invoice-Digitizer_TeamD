<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Receipt and Invoice Digitizer</title>
<style>
    body {
    background-color: #f4c9cf; /* soft pink background */
    height: 100vh;
}

.container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.forgot_password {
    background: #fff5f7; /* very light pink card */
    width: 250px;
    height: 250px;
    padding: 30px;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(180, 60, 100, 0.15); /* pink-tinted shadow */
    text-align: center;
}

.send_email {
    width: 100%;
    padding: 12px;
    background: #d63384; /* pink button */
    color: #ffffff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

.send_email:hover {
    background: #b92d70; /* darker pink hover */
}

.input-box {
    width: 100%;
    padding: 5px;
    height: 25px;
    margin-bottom: 15px;
    border: 1px solid #d48a9c; /* pink border */
    border-radius: 4px;
    font-size: 14px;
    color: #2b2b2b;
    background-color: #ffffff;
}

.input-box::placeholder {
    color: #5a5a5a;
}

.links {
    text-decoration: none;
    color: #444444; /* dark grey like image */
}

.links:hover {
    text-decoration: underline;
}

.send_email:disabled {
    background-color: #cfa1b3; /* muted pink disabled */
    cursor: not-allowed;
}

</style></head>
<body>

<div class="container">
    <div class="forgot_password">
        <div>
            <h2>Forgot Password</h2>

            <form id="forgotPasswordForm">
                <input
                    type="email"
                    name="email"
                    id="email"
                    class="input-box"
                    placeholder="Enter your email"
                    required
                >
                <br><br>

                <button type="submit" class="send_email">
                    Send reset mail
                </button>
            </form>

            <br>
            <a href="/" class="links">Back to Login</a>
        </div>
    </div>
</div>

<script>
    // Handle forgot password form submission
    document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('email', document.getElementById('email').value);
        
        try {
            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                alert(data.message);
                window.location.href = '/';
            } else {
                alert(data.message || 'Email not found');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Please try again.');
        }
    });
</script>

</body>
</html>
