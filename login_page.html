<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Receipt and Invoice Digitizer</title>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background-color: #f4c9cf; /* soft pink background like image */
    height: 100vh;
}

.login-container {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.login-box {
    background: #fff5f7; /* very light pink card */
    width: 350px;
    padding: 30px;
    border-radius: 6px;
    box-shadow: 0 0 10px rgba(180, 60, 100, 0.15); /* pink-tinted shadow */
    text-align: center;
}

/* Heading */
.logo {
    margin-bottom: 20px;
    font-weight: bold;
    color: #2b2b2b; /* dark text like image */
}

/* Input fields */
.input-box {
    width: 100%;
    padding: 12px;
    margin-bottom: 15px;
    border: 1.5px solid #d48a9c; /* pink border */
    border-radius: 4px;
    font-size: 14px;
    color: #2b2b2b; /* dark text */
    background-color: #ffffff;
}

/* Placeholder text */
.input-box::placeholder {
    color: #5a5a5a; /* slightly dark placeholder */
}

.input-box:focus {
    outline: none;
    border-color: #c94a78; /* stronger pink focus */
}

/* Sign in button */
.login-btn {
    width: 100%;
    padding: 12px;
    background: #d63384; /* pink button like image */
    color: #ffffff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
}

.login-btn:hover {
    background: #b92d70;
}

/* Forgot password & Sign up */
.links {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: 13px;
}

.links a {
    text-decoration: none;
    color: #444444; /* dark grey like image */
}

.links a:hover {
    text-decoration: underline;
}

/* OR text */
.or-text {
    margin: 20px 0 10px;
    font-size: 13px;
    color: #555555; /* darker OR text */
}

/* Social login */
.social-login {
    display: flex;
    justify-content: center;
    gap: 15px;
}

.social {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1.5px solid #d48a9c; /* pink border */
    background: #ffffff;
    cursor: pointer;
    font-size: 16px;
    color: #2b2b2b; /* dark icon */
}

.social:hover {
    background: #f7dbe2; /* light pink hover */
}

</style></head>
<body>

<div class="login-container">
    <div class="login-box">
        <h2 class="logo">Receipt and Invoice Digitizer</h2>

        <form id="loginForm">
            <input type="text" name="username" id="username" placeholder="Username or Email" class="input-box" required>
            <input type="password" name="password" id="password" placeholder="Password" class="input-box" required>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="links">
            <a href="/forgot_password_page">Forgot Password?</a>
            <a href="/register_page">Sign Up</a>
        </div>

        <p class="or-text">or you can sign in with</p>

        <div class="social-login">
            <button class="social google">G</button>
        </div>
    </div>
</div>

<script>
    // Handle login form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = new FormData();
        formData.append('username', document.getElementById('username').value);
        formData.append('password', document.getElementById('password').value);
        
        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            
            if (data.success) {
                // Redirect to dashboard
                window.location.href = '/dashboard';
            } else {
                alert(data.message || 'Login failed');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred. Please try again.');
        }
    });
</script>

</body>
</html>
